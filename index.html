<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khoa Nội Đoàn Kết</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3436;
        }

        .app-shell {
            width: 100%;
            max-width: 420px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #4834d4;
        }

        .header p {
            font-size: 14px;
            color: #636e72;
            margin-bottom: 30px;
        }

        .menu-grid {
            display: grid;
            gap: 15px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            padding: 18px;
            text-decoration: none;
            background: #ffffff;
            border-radius: 18px;
            border: 2px solid #f1f2f6;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .menu-link:active {
            transform: scale(0.97);
            background-color: #f8f9fa;
        }

        .menu-link:hover {
            border-color: #4834d4;
            box-shadow: 0 5px 15px rgba(72, 52, 212, 0.1);
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        /* Định nghĩa màu sắc riêng cho từng loại */
        .bg-boctham { background-color: #ffeaa7; color: #d35400; }
        .bg-batcap { background-color: #dff9fb; color: #0984e3; }
        .bg-bocqua { background-color: #fab1a0; color: #d63031; }

        .label {
            font-weight: 700;
            font-size: 18px;
            color: #2d3436;
        }

        .arrow {
            margin-left: auto;
            color: #b2bec3;
            font-size: 20px;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #b2bec3;
        }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="header">
        <h1>Mini App</h1>
        <p>Chọn một tính năng để bắt đầu</p>
    </div>

    <div class="menu-grid">
        <a href="https://drphucpx.github.io/boctham" class="menu-link">
            <div class="icon-circle bg-boctham">🎟️</div>
            <span class="label">Bốc thăm</span>
            <span class="arrow">›</span>
        </a>

        <a href="https://drphucpx.github.io/batcap" class="menu-link">
            <div class="icon-circle bg-batcap">🤝</div>
            <span class="label">Bắt cặp</span>
            <span class="arrow">›</span>
        </a>

        <a href="https://drphucpx.github.io/bocqua" class="menu-link">
            <div class="icon-circle bg-bocqua">🎁</div>
            <span class="label">Bốc quà</span>
            <span class="arrow">›</span>
        </a>
    </div>

    <footer>
        &copy; 2026 Bs Phuc thiết kế
    </footer>
</div>

</body>
</html>
